<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e1a" />
  <title>Proxi — ubicación precisa en vivo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root{
      --bg:#0b0e1a; --surface:#12172a; --surface2:#1a2039; --line:rgba(255,255,255,.10);
      --text:#edeff7; --mute:#8e94b0; --you:#ff4d6d; --friend:#45c6f0;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
    #map{position:absolute;inset:0;background:#0b0e1a}

    /* top bar */
    .topbar{
      position:absolute;top:0;left:0;right:0;z-index:1000;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
      background:linear-gradient(180deg,rgba(11,14,26,.92),rgba(11,14,26,0));
      pointer-events:none;
    }
    .brand{display:flex;align-items:baseline;gap:8px;pointer-events:auto}
    .brand .logo{font-size:20px;font-weight:800;letter-spacing:-.04em}
    .brand .logo span{color:var(--you)}
    .brand .room{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.05em}
    .share{
      pointer-events:auto;display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
      background:linear-gradient(180deg,#ff607d,var(--you));color:#fff;font-family:var(--sans);
      font-size:13.5px;font-weight:700;padding:9px 14px;border-radius:12px;
      box-shadow:0 8px 20px -8px rgba(255,77,109,.8);
    }
    .share:active{transform:translateY(1px)}

    /* status pill */
    .status{
      position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);
      z-index:1000;font-size:12px;font-weight:600;color:var(--text);
      background:rgba(10,13,26,.82);border:1px solid var(--line);backdrop-filter:blur(8px);
      padding:7px 13px;border-radius:999px;display:flex;align-items:center;gap:8px;white-space:nowrap;
      transition:opacity .3s;max-width:92vw;
    }
    .status b{width:7px;height:7px;border-radius:50%;background:var(--friend);flex:0 0 auto}
    .status.warn b{background:#f2b25c}
    .status.hide{opacity:0;pointer-events:none}

    /* follow toggle (floating) */
    .followbtn{
      position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 190px);z-index:1000;
      display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);cursor:pointer;
      background:rgba(10,13,26,.85);backdrop-filter:blur(10px);color:var(--text);
      font-family:var(--sans);font-size:12.5px;font-weight:700;padding:10px 13px;border-radius:12px;
    }
    .followbtn .ic{width:14px;height:14px;border-radius:50%;border:2px solid var(--friend);position:relative}
    .followbtn.manual .ic{border-color:var(--mute)}
    .followbtn.manual{color:var(--mute)}

    /* bottom sheet */
    .sheet{
      position:absolute;left:0;right:0;bottom:0;z-index:1000;
      background:linear-gradient(180deg,var(--surface),var(--bg));
      border-top:1px solid var(--line);border-radius:22px 22px 0 0;
      padding:14px 18px calc(env(safe-area-inset-bottom) + 16px);
      box-shadow:0 -18px 40px -24px rgba(0,0,0,.7);
    }
    .grip{width:36px;height:4px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto 14px}
    .row{display:flex;align-items:center;gap:13px}
    .puck{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
      background:rgba(255,77,109,.14);border:1px solid rgba(255,77,109,.3)}
    .puck b{width:12px;height:12px;border-radius:50%;background:var(--you);box-shadow:0 0 12px var(--you)}
    .puck.friend{background:rgba(69,198,240,.14);border-color:rgba(69,198,240,.3)}
    .puck.friend b{background:var(--friend);box-shadow:0 0 12px var(--friend)}
    .info{flex:1;min-width:0}
    .info .lead{font-size:14.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .info .sub{font-size:12px;color:var(--mute);margin-top:2px}
    .metric{text-align:right;flex:0 0 auto}
    .metric .big{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
    .metric .unit{font-size:10.5px;color:var(--mute);margin-top:4px;letter-spacing:.05em}

    .controls{display:flex;gap:9px;margin-top:14px}
    .controls button{
      flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);
      border-radius:12px;padding:11px 8px;font-family:var(--sans);font-size:12.5px;font-weight:700;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:7px;transition:border-color .15s,background .15s}
    .controls button:active{transform:translateY(1px)}
    .controls button.on{border-color:var(--you);background:rgba(255,77,109,.12);color:#ffb3c1}
    .controls .dotc{width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(45deg);background:currentColor}

    /* navegación hacia la persona */
    .nav{display:flex;align-items:center;gap:14px;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}
    .compass{width:64px;height:64px;flex:0 0 auto;border-radius:50%;position:relative;display:grid;place-items:center;
      background:radial-gradient(circle at 50% 42%,rgba(255,77,109,.16),rgba(10,13,26,.35));border:1px solid var(--line)}
    .compass .n{position:absolute;top:5px;font:700 9px var(--sans);color:var(--mute);letter-spacing:.05em}
    .arrow{width:36px;height:36px;transition:transform .18s ease-out;transform-origin:50% 50%;filter:drop-shadow(0 0 6px rgba(255,77,109,.6))}
    .navinfo{flex:1;min-width:0}
    .navinfo .nd{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
    .navinfo .nd small{font-size:12px;color:var(--mute);font-family:var(--sans);margin-left:4px}
    .navtrend{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--mute)}
    .navtrend.closer{background:rgba(70,200,120,.16);color:#5fd08a}
    .navtrend.farther{background:rgba(242,178,92,.16);color:#f2b25c}
    .compassBtn{flex:0 0 auto;border:1px solid var(--line);background:rgba(69,198,240,.12);color:var(--friend);
      font:700 11.5px var(--sans);line-height:1.15;text-align:center;padding:9px 11px;border-radius:11px;cursor:pointer}

    .namebar{display:flex;gap:9px;margin-top:10px}
    .namebar input{
      flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
      color:var(--text);font-family:var(--sans);font-size:13.5px;padding:11px 13px;outline:none}
    .namebar input:focus{border-color:var(--friend)}

    /* leaflet marker labels */
    .pin{width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 14px var(--gl)}
    .pin.you{background:var(--you);--gl:rgba(255,77,109,.9)}
    .pin.friend{background:var(--friend);--gl:rgba(69,198,240,.9)}
    .plabel{position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;
      font:700 11px var(--sans);color:#fff;background:rgba(10,13,26,.85);padding:2px 7px;border-radius:6px;border:1px solid var(--line)}
    .leaflet-container{background:#0b0e1a;font-family:var(--sans)}
    .leaflet-control-attribution{font-size:9px;background:rgba(10,13,26,.6)!important;color:var(--mute)!important}
    .leaflet-control-attribution a{color:var(--friend)!important}
    .leaflet-bar a{background:var(--surface)!important;color:var(--text)!important;border-color:var(--line)!important}
    .leaflet-control-layers{background:rgba(10,13,26,.85)!important;color:var(--text)!important;border:1px solid var(--line)!important;border-radius:12px!important;backdrop-filter:blur(10px)}
    .leaflet-control-layers-toggle{background-color:var(--surface)!important}
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="brand">
      <span class="logo">Prox<span>i</span></span>
      <span class="room" id="roomLabel">sala ·</span>
    </div>
    <div style="display:flex;gap:8px;pointer-events:auto">
      <a class="share" id="juntaBtn" style="background:linear-gradient(180deg,#ffe08a,#ffd166);color:#3a2c00;box-shadow:0 8px 20px -8px rgba(255,209,102,.7);text-decoration:none">🚩 Junta</a>
      <button class="share" id="shareBtn">Compartir sala</button>
    </div>
  </div>

  <div class="status warn" id="status"><b></b><span id="statusTxt">Ubicándote…</span></div>

  <button class="followbtn" id="followBtn"><span class="ic"></span>Seguir: auto</button>

  <div class="sheet">
    <div class="grip"></div>
    <div class="row">
      <div class="puck friend" id="puck"><b></b></div>
      <div class="info">
        <div class="lead" id="lead">Esperando a alguien en la sala…</div>
        <div class="sub" id="sub">Comparte el link para que se unan</div>
      </div>
      <div class="metric" id="metric" style="display:none">
        <div class="big" id="dist">—</div>
        <div class="unit">metros</div>
      </div>
    </div>

    <div class="nav" id="nav" style="display:none">
      <div class="compass"><span class="n">N</span>
        <svg class="arrow" id="arrow" viewBox="-12 -16 24 32" aria-hidden="true"><path d="M0,-15 L9,11 L0,5 L-9,11 Z" fill="#ff4d6d"/></svg>
      </div>
      <div class="navinfo">
        <div class="nd"><span id="navDist">—</span><small>metros</small></div>
        <div class="navtrend" id="navTrend">calculando…</div>
      </div>
      <button class="compassBtn" id="compassBtn" style="display:none">Activar<br>brújula</button>
    </div>

    <div class="controls">
      <button id="preciseBtn"><span class="dotc"></span>Fijar mi punto exacto</button>
      <button id="gpsBtn" class="on">Usar mi GPS</button>
    </div>
    <div class="namebar">
      <input id="nameInput" maxlength="18" placeholder="Tu nombre" autocomplete="off" />
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiqAsxD7_Me22aGHT9SO_AnRkJFyC5Xaw",
      authDomain: "proxi-live.firebaseapp.com",
      projectId: "proxi-live",
      storageBucket: "proxi-live.firebasestorage.app",
      messagingSenderId: "188965732831",
      appId: "1:188965732831:web:dd1eced1c6ce771c1ac46a"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---- identity + room ----
    const rnd = n => Array.from({length:n}, () => "abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*30)]).join("");
    let uid = localStorage.getItem("proxi_uid");
    if(!uid){ uid = rnd(9); localStorage.setItem("proxi_uid", uid); }
    const url = new URL(location.href);
    let room = url.searchParams.get("s");
    if(!room){ room = rnd(5); url.searchParams.set("s", room); history.replaceState(null,"",url); }
    document.getElementById("roomLabel").textContent = "sala · " + room;

    let name = localStorage.getItem("proxi_name") || ("Invitado-" + rnd(3));
    const nameInput = document.getElementById("nameInput");
    nameInput.value = name;
    nameInput.addEventListener("input", () => { name = nameInput.value.trim() || ("Invitado-"+uid.slice(0,3)); localStorage.setItem("proxi_name", name); pushNow(); });

    // ---- map ----
    const map = L.map("map", { zoomControl:true, attributionControl:true, tap:true }).setView([-33.4489,-70.6693], 3);
    L.control.zoom({position:"topright"}); // default
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom:22, maxNativeZoom:19, attribution:"Imagery © Esri" });
    const relief = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}", {
      maxZoom:22, maxNativeZoom:13, attribution:"Relieve © Esri" });
    const streets = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom:22, maxNativeZoom:20, attribution:"© OpenStreetMap, © CARTO" });
    sat.addTo(map);
    L.control.layers({ "Satélite":sat, "Relieve":relief, "Oscuro":streets }, null, { position:"topright" }).addTo(map);

    // ---- follow mode (auto by default) ----
    let follow = true;
    const followBtn = document.getElementById("followBtn");
    function setFollow(v){ follow = v; followBtn.classList.toggle("manual", !v);
      followBtn.innerHTML = '<span class="ic"></span>Seguir: ' + (v ? "auto" : "manual");
      if(v) fitAll(); }
    followBtn.addEventListener("click", () => setFollow(!follow));
    map.on("dragstart zoomstart", (e) => { if(userInteracting) setFollow(false); });
    let userInteracting = false;
    map.on("mousedown touchstart wheel", () => { userInteracting = true; });
    map.on("moveend", () => { userInteracting = false; });

    // ---- my position (GPS or manual pin) ----
    let gps = null;        // {lat,lng,acc}
    let manual = null;     // {lat,lng} precise, overrides gps
    let usingManual = false;
    const preciseBtn = document.getElementById("preciseBtn");
    const gpsBtn = document.getElementById("gpsBtn");
    preciseBtn.addEventListener("click", () => {
      const c = map.getCenter();
      manual = { lat:c.lat, lng:c.lng }; usingManual = true;
      preciseBtn.classList.add("on"); gpsBtn.classList.remove("on");
      preciseBtn.querySelector("span")?.remove();
      preciseBtn.innerHTML = '<span class="dotc"></span>Arrastra tu punto';
      setStatus("Mueve el mapa y toca de nuevo para afinar tu punto (±1 m)", false);
      pushNow();
    });
    map.on("dblclick", (e) => { manual = { lat:e.latlng.lat, lng:e.latlng.lng }; usingManual = true;
      preciseBtn.classList.add("on"); gpsBtn.classList.remove("on"); pushNow(); });
    map.doubleClickZoom.disable();
    gpsBtn.addEventListener("click", () => { usingManual = false; manual = null;
      gpsBtn.classList.add("on"); preciseBtn.classList.remove("on");
      preciseBtn.innerHTML = '<span class="dotc"></span>Fijar mi punto exacto'; pushNow(); });

    function myPos(){ return usingManual && manual ? {lat:manual.lat,lng:manual.lng,acc:1.5,precise:true}
                                                    : (gps ? {lat:gps.lat,lng:gps.lng,acc:gps.acc,precise:false} : null); }

    // ---- geolocation ----
    const status = document.getElementById("status");
    const statusTxt = document.getElementById("statusTxt");
    function setStatus(t, ok=true){ statusTxt.textContent = t; status.classList.toggle("warn", !ok); status.classList.remove("hide"); }
    if("geolocation" in navigator){
      navigator.geolocation.watchPosition(
        p => { gps = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy };
               if(firstFix){ firstFix=false; map.setView([gps.lat,gps.lng], 18); }
               setStatus(dbReady ? "Compartiendo en vivo" : "Ubicación lista · activando sala…", dbReady);
               pushNow(); },
        e => setStatus("Activa el permiso de ubicación para compartir", false),
        { enableHighAccuracy:true, maximumAge:1000, timeout:20000 });
    } else setStatus("Este equipo no soporta geolocalización", false);
    let firstFix = true;

    // ---- Firestore sync ----
    let dbReady = false, lastPush = 0, pending=false;
    const meDoc = doc(db, "salas", room, "miembros", uid);
    async function pushNow(){
      const pos = myPos(); if(!pos) return;
      const now = Date.now(); if(now - lastPush < 1200){ pending=true; return; }
      lastPush = now; pending=false;
      try{
        await setDoc(meDoc, { name, lat:pos.lat, lng:pos.lng, acc:pos.acc, precise:pos.precise, ts:serverTimestamp(), t:now });
        if(!dbReady){ dbReady=true; setStatus("Compartiendo en vivo", true); setTimeout(()=>status.classList.add("hide"), 2500); }
      }catch(err){ setStatus("Sala aún no activa (falta habilitar la base de datos)", false); }
    }
    setInterval(()=>{ if(pending) pushNow(); }, 1300);
    window.addEventListener("beforeunload", () => { try{ deleteDoc(meDoc); }catch(e){} });

    // ---- render members ----
    const markers = new Map();
    function mkIcon(kind, label){ return L.divIcon({ className:"", html:`<div class="pin ${kind}"><span class="plabel">${label}</span></div>`, iconSize:[20,20], iconAnchor:[10,10] }); }
    let accCircle = null;

    onSnapshot(collection(db,"salas",room,"miembros"), snap => {
      const now = Date.now(); const seen = new Set(); const pts = [];
      let me=null, nearest=null, nd=Infinity;
      snap.forEach(d => {
        const m = d.data(); if(!m || m.lat==null) return;
        if(m.t && now - m.t > 90000) return; // stale
        seen.add(d.id);
        const isMe = d.id === uid;
        const ll = [m.lat, m.lng];
        pts.push(ll);
        let mk = markers.get(d.id);
        if(!mk){ mk = L.marker(ll, { icon:mkIcon(isMe?"you":"friend", isMe?"tú":(m.name||"amigo")) }).addTo(map); markers.set(d.id, mk); }
        else { mk.setLatLng(ll); mk.setIcon(mkIcon(isMe?"you":"friend", isMe?"tú":(m.name||"amigo"))); }
        if(isMe){ me = m;
          if(accCircle) map.removeLayer(accCircle);
          accCircle = L.circle(ll, { radius:Math.max(m.acc||10,1.5), color:"#ff4d6d", weight:1, fillColor:"#ff4d6d", fillOpacity:.08 }).addTo(map);
        }
      });
      // remove gone
      for(const [id,mk] of markers){ if(!seen.has(id)){ map.removeLayer(mk); markers.delete(id); } }
      // distance to nearest other
      if(me){ snap.forEach(d => { if(d.id===uid) return; const m=d.data(); if(!m||m.lat==null) return; if(m.t && now-m.t>90000) return;
        const dd = haversine(me.lat,me.lng,m.lat,m.lng); if(dd<nd){ nd=dd; nearest=m; } }); }
      const brng = (me && nearest) ? bearingDeg(me.lat,me.lng,nearest.lat,nearest.lng) : null;
      updateSheet(nearest, nd, brng, me ? me.acc : null);
      if(follow && pts.length) fitAll(pts);
    }, err => setStatus("Sala aún no activa (falta habilitar la base de datos)", false));

    function fitAll(pts){
      pts = pts || Array.from(markers.values()).map(m => { const l=m.getLatLng(); return [l.lat,l.lng]; });
      if(!pts.length) return;
      if(pts.length===1){ map.setView(pts[0], Math.max(map.getZoom(),18)); return; }
      map.fitBounds(L.latLngBounds(pts).pad(0.45), { maxZoom:21, animate:true });
    }

    const lead=document.getElementById("lead"), sub=document.getElementById("sub"),
          metric=document.getElementById("metric"), distEl=document.getElementById("dist"), puck=document.getElementById("puck");
    function updateSheet(other, d, brng, myAcc){
      if(other){
        // ¿los dos puntos son GPS y sus márgenes de error se solapan? → están "juntos" dentro del error
        const bothGps = !other.precise && (myAcc != null);
        const margin = Math.min(15, Math.round((myAcc || 8) + (other.acc || 8)));
        const together = bothGps && d <= margin;

        lead.textContent = other.name + (other.precise ? " · punto exacto" : "");
        sub.textContent = other.precise ? "Fijado a mano · ±1,5 m" : "GPS · ±" + Math.round(other.acc||15) + " m";
        metric.style.display = "block";
        distEl.textContent = d < 10 ? d.toFixed(1) : Math.round(d);
        // navegación hacia la persona
        if(brng != null) curBearing = brng;
        navEl.style.display = "flex";
        navDistEl.textContent = d < 10 ? d.toFixed(1) : Math.round(d);

        if(together){
          navTrendEl.textContent = "prácticamente juntos · ±" + margin + " m de GPS";
          navTrendEl.className = "navtrend closer";
          arrowEl.style.opacity = "0.2";   // la dirección no tiene sentido a esta distancia
          lastNavD = d;
        } else {
          arrowEl.style.opacity = "1";
          if(lastNavD != null && Math.abs(d - lastNavD) > 0.4){
            navTrendEl.textContent = d < lastNavD ? "te acercas" : "te alejas";
            navTrendEl.className = "navtrend " + (d < lastNavD ? "closer" : "farther");
            lastNavD = d;
          } else if(lastNavD == null){
            navTrendEl.textContent = headingReady ? "camina hacia la flecha" : "flecha: norte arriba (activa brújula)";
            navTrendEl.className = "navtrend";
            lastNavD = d;
          }
        }
        updateArrow();
      } else {
        lead.textContent = "Esperando a alguien en la sala…";
        sub.textContent = "Comparte el link para que se unan";
        metric.style.display = "none";
        navEl.style.display = "none";
        lastNavD = null;
      }
    }
    function haversine(a,b,c,d){ const R=6371000,rad=x=>x*Math.PI/180;
      const dLat=rad(c-a),dLng=rad(d-b); const s=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2;
      return 2*R*Math.asin(Math.sqrt(s)); }

    // ---- navegación "hacia mí": rumbo + brújula + tendencia ----
    const navEl=document.getElementById("nav"), arrowEl=document.getElementById("arrow"),
          navDistEl=document.getElementById("navDist"), navTrendEl=document.getElementById("navTrend"),
          compassBtn=document.getElementById("compassBtn");
    let curBearing=null, heading=null, headingReady=false, lastNavD=null;

    // rumbo geográfico de (1)->(2) en grados, 0=Norte, horario
    function bearingDeg(lat1,lon1,lat2,lon2){ const r=x=>x*Math.PI/180,g=x=>x*180/Math.PI;
      const y=Math.sin(r(lon2-lon1))*Math.cos(r(lat2));
      const x=Math.cos(r(lat1))*Math.sin(r(lat2))-Math.sin(r(lat1))*Math.cos(r(lat2))*Math.cos(r(lon2-lon1));
      return (g(Math.atan2(y,x))+360)%360; }

    // la flecha apunta al rumbo real relativo a hacia dónde mira el teléfono
    function updateArrow(){ if(curBearing==null) return;
      const rel = headingReady ? ((curBearing-heading+360)%360) : curBearing;
      arrowEl.style.transform = "rotate("+rel.toFixed(1)+"deg)"; }

    function onOrient(e){ let h=null;
      if(typeof e.webkitCompassHeading==="number" && !isNaN(e.webkitCompassHeading)) h=e.webkitCompassHeading; // iOS: ya es Norte, horario
      else if(typeof e.alpha==="number" && e.alpha!=null) h=(360-e.alpha)%360; // Android (mejor esfuerzo, portrait)
      if(h!=null){ heading=h; if(!headingReady){ headingReady=true; compassBtn.style.display="none"; } updateArrow(); } }
    function startOrient(){ window.addEventListener("deviceorientationabsolute",onOrient,true);
      window.addEventListener("deviceorientation",onOrient,true); }
    function enableCompass(){
      if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
        DeviceOrientationEvent.requestPermission().then(s=>{ if(s==="granted") startOrient(); }).catch(()=>{});
      } else startOrient(); }
    compassBtn.addEventListener("click", enableCompass);
    if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      compassBtn.style.display=""; // iOS necesita un toque para permitir la brújula
    } else { startOrient(); }

    // ---- junta del grupo (misma sala) ----
    document.getElementById("juntaBtn").href = "/junta.html?s=" + room;

    // ---- share ----
    document.getElementById("shareBtn").addEventListener("click", async () => {
      const link = location.origin + location.pathname + "?s=" + room;
      const msg = "Únete a mi sala en Proxi para encontrarnos exacto: " + link;
      if(navigator.share){ try{ await navigator.share({ title:"Proxi", text:"Encontrémonos exacto en Proxi", url:link }); return; }catch(e){} }
      try{ await navigator.clipboard.writeText(link); setStatus("Link copiado ✓ pégalo por WhatsApp", true); setTimeout(()=>status.classList.remove("hide"),0); }
      catch(e){ window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank"); }
    });
  </script>
