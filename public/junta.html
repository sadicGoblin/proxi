<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e1a" />
  <title>Proxi — Junta del grupo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚩</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root{
      --bg:#0b0e1a; --surface:#12172a; --surface2:#1a2039; --line:rgba(255,255,255,.10);
      --text:#edeff7; --mute:#8e94b0; --you:#ff4d6d; --friend:#45c6f0; --flag:#ffd166;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
    #map{position:absolute;inset:0;background:#0b0e1a}

    .topbar{
      position:absolute;top:0;left:0;right:0;z-index:1000;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
      background:linear-gradient(180deg,rgba(11,14,26,.92),rgba(11,14,26,0));
      pointer-events:none;
    }
    .brand{display:flex;align-items:baseline;gap:8px;pointer-events:auto}
    .brand .logo{font-size:20px;font-weight:800;letter-spacing:-.04em}
    .brand .logo span{color:var(--you)}
    .brand .room{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.05em}
    .share{
      pointer-events:auto;display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
      background:linear-gradient(180deg,#ff607d,var(--you));color:#fff;font-family:var(--sans);
      font-size:13.5px;font-weight:700;padding:9px 14px;border-radius:12px;
      box-shadow:0 8px 20px -8px rgba(255,77,109,.8);
    }
    .share:active{transform:translateY(1px)}

    .status{
      position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);
      z-index:1000;font-size:12px;font-weight:600;color:var(--text);
      background:rgba(10,13,26,.82);border:1px solid var(--line);backdrop-filter:blur(8px);
      padding:7px 13px;border-radius:999px;display:flex;align-items:center;gap:8px;white-space:nowrap;
      transition:opacity .3s;max-width:92vw;
    }
    .status b{width:7px;height:7px;border-radius:50%;background:var(--friend);flex:0 0 auto}
    .status.warn b{background:#f2b25c}
    .status.hide{opacity:0;pointer-events:none}

    /* aviso de cambio (toast) */
    .toast{
      position:absolute;top:calc(env(safe-area-inset-top) + 96px);left:50%;transform:translateX(-50%) translateY(-8px);
      z-index:1001;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
      background:linear-gradient(180deg,#2a2340,#1c1a33);border:1px solid rgba(255,209,102,.4);
      border-radius:14px;padding:11px 15px;display:flex;gap:10px;align-items:center;
      box-shadow:0 14px 34px -14px rgba(0,0,0,.8);
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast .ic{font-size:20px}
    .toast .tx{font-size:13px;font-weight:600;line-height:1.35}
    .toast .tx small{display:block;color:var(--mute);font-weight:500;font-size:11.5px;margin-top:2px}

    /* crosshair para colocar el punto */
    .cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:900;pointer-events:none;display:none}
    .cross.on{display:block}
    .cross svg{filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
    .placebar{
      position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 24px);
      z-index:1100;display:none;gap:9px;padding:10px;border-radius:16px;
      background:rgba(10,13,26,.9);border:1px solid var(--line);backdrop-filter:blur(10px);
    }
    .placebar.on{display:flex}
    .placebar button{border:none;border-radius:11px;padding:11px 16px;font:700 13.5px var(--sans);cursor:pointer}
    .placebar .ok{background:linear-gradient(180deg,#ffe08a,var(--flag));color:#3a2c00}
    .placebar .no{background:var(--surface2);color:var(--text);border:1px solid var(--line)}

    /* bottom sheet */
    .sheet{
      position:absolute;left:0;right:0;bottom:0;z-index:1000;
      background:linear-gradient(180deg,var(--surface),var(--bg));
      border-top:1px solid var(--line);border-radius:22px 22px 0 0;
      padding:14px 18px calc(env(safe-area-inset-bottom) + 16px);
      box-shadow:0 -18px 40px -24px rgba(0,0,0,.7);
      transition:transform .25s;
    }
    .sheet.away{transform:translateY(110%)}
    .grip{width:36px;height:4px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto 14px}
    .row{display:flex;align-items:center;gap:13px}
    .puck{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-size:20px;
      background:rgba(255,209,102,.14);border:1px solid rgba(255,209,102,.35)}
    .info{flex:1;min-width:0}
    .info .lead{font-size:14.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .info .sub{font-size:12px;color:var(--mute);margin-top:2px}
    .metric{text-align:right;flex:0 0 auto}
    .metric .big{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
    .metric .unit{font-size:10.5px;color:var(--mute);margin-top:4px;letter-spacing:.05em}

    .timechips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
      background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:7px 13px}
    .chip.hot{border-color:rgba(255,209,102,.45);background:rgba(255,209,102,.1);color:#ffe4a1}
    .chip.soon{border-color:rgba(95,208,138,.45);background:rgba(95,208,138,.1);color:#8ce0ab}
    .chip.late{border-color:rgba(242,178,92,.45);background:rgba(242,178,92,.12);color:#f2b25c}

    .controls{display:flex;gap:9px;margin-top:14px}
    .controls button{
      flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);
      border-radius:12px;padding:11px 8px;font-family:var(--sans);font-size:12.5px;font-weight:700;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:7px}
    .controls button:active{transform:translateY(1px)}
    .controls button.main{border-color:rgba(255,209,102,.5);background:rgba(255,209,102,.12);color:#ffe4a1}

    .hist{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);overflow:hidden;display:none}
    .hist.on{display:block}
    .hist .h{padding:9px 13px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mute)}
    .hist ul{list-style:none;margin:0;padding:0 13px 10px;max-height:130px;overflow:auto}
    .hist li{font-size:12.5px;padding:6px 0;border-top:1px solid rgba(255,255,255,.05);line-height:1.4}
    .hist li b{color:#ffe4a1;font-weight:700}
    .hist li small{color:var(--mute)}

    .namebar{display:flex;gap:9px;margin-top:12px}
    .namebar input{
      flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
      color:var(--text);font-family:var(--sans);font-size:13.5px;padding:11px 13px;outline:none}
    .namebar input:focus{border-color:var(--friend)}

    /* modal hora */
    .modal{position:absolute;inset:0;z-index:1200;display:none;place-items:center;background:rgba(5,7,16,.6);backdrop-filter:blur(4px)}
    .modal.on{display:grid}
    .card{width:min(92vw,360px);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
    .card h3{margin:0 0 4px;font-size:16px}
    .card p{margin:0 0 14px;font-size:12.5px;color:var(--mute)}
    .card input[type="datetime-local"],.card input[type="text"]{
      width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
      color:var(--text);font-family:var(--sans);font-size:14px;padding:12px;outline:none;color-scheme:dark;margin-bottom:10px}
    .card .acts{display:flex;gap:9px;margin-top:6px}
    .card .acts button{flex:1;border:none;border-radius:12px;padding:12px;font:700 13.5px var(--sans);cursor:pointer}
    .card .acts .ok{background:linear-gradient(180deg,#ffe08a,var(--flag));color:#3a2c00}
    .card .acts .no{background:var(--surface2);color:var(--text);border:1px solid var(--line)}

    /* pins */
    .pin{width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 14px var(--gl)}
    .pin.you{background:var(--you);--gl:rgba(255,77,109,.9)}
    .pin.friend{background:var(--friend);--gl:rgba(69,198,240,.9)}
    .plabel{position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;
      font:700 11px var(--sans);color:#fff;background:rgba(10,13,26,.85);padding:2px 7px;border-radius:6px;border:1px solid var(--line)}
    .flagpin{position:relative;font-size:30px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
    .flagpin .plabel{top:-20px;border-color:rgba(255,209,102,.5)}
    .leaflet-container{background:#0b0e1a;font-family:var(--sans)}
    .leaflet-control-attribution{font-size:9px;background:rgba(10,13,26,.6)!important;color:var(--mute)!important}
    .leaflet-control-attribution a{color:var(--friend)!important}
    .leaflet-bar a{background:var(--surface)!important;color:var(--text)!important;border-color:var(--line)!important}
    .leaflet-control-layers{background:rgba(10,13,26,.85)!important;color:var(--text)!important;border:1px solid var(--line)!important;border-radius:12px!important;backdrop-filter:blur(10px)}
    .leaflet-control-layers-toggle{background-color:var(--surface)!important}
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="brand">
      <span class="logo">Prox<span>i</span></span>
      <span class="room" id="roomLabel">junta ·</span>
    </div>
    <button class="share" id="shareBtn">Invitar al grupo</button>
  </div>

  <div class="status warn" id="status"><b></b><span id="statusTxt">Ubicándote…</span></div>

  <div class="toast" id="toast"><span class="ic">🚩</span><div class="tx" id="toastTx"></div></div>

  <div class="cross" id="cross">
    <svg width="46" height="46" viewBox="0 0 46 46">
      <circle cx="23" cy="23" r="15" fill="none" stroke="#ffd166" stroke-width="2.5"/>
      <circle cx="23" cy="23" r="2.6" fill="#ffd166"/>
      <line x1="23" y1="0" x2="23" y2="9" stroke="#ffd166" stroke-width="2.5"/>
      <line x1="23" y1="37" x2="23" y2="46" stroke="#ffd166" stroke-width="2.5"/>
      <line x1="0" y1="23" x2="9" y2="23" stroke="#ffd166" stroke-width="2.5"/>
      <line x1="37" y1="23" x2="46" y2="23" stroke="#ffd166" stroke-width="2.5"/>
    </svg>
  </div>
  <div class="placebar" id="placebar">
    <button class="no" id="placeCancel">Cancelar</button>
    <button class="ok" id="placeOk">🚩 La junta es aquí</button>
  </div>

  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <div class="row">
      <div class="puck">🚩</div>
      <div class="info">
        <div class="lead" id="lead">Aún no hay punto de junta</div>
        <div class="sub" id="sub">Fija dónde se juntan y compártelo al grupo</div>
      </div>
      <div class="metric" id="metric" style="display:none">
        <div class="big" id="dist">—</div>
        <div class="unit" id="distUnit">metros</div>
      </div>
    </div>

    <div class="timechips" id="timechips" style="display:none">
      <span class="chip hot" id="chipWhen">🕒 —</span>
      <span class="chip" id="chipCount">—</span>
      <span class="chip" id="chipPeople">👥 solo tú</span>
    </div>

    <div class="controls">
      <button class="main" id="setPointBtn">🚩 Fijar la junta aquí</button>
      <button id="setTimeBtn">🕒 Hora</button>
      <button id="histBtn">📜</button>
    </div>

    <div class="hist" id="hist">
      <div class="h">CAMBIOS DE LA JUNTA</div>
      <ul id="histList"></ul>
    </div>

    <div class="namebar">
      <input id="nameInput" maxlength="18" placeholder="Tu nombre" autocomplete="off" />
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="card">
      <h3>¿A qué hora es la junta?</h3>
      <p>Todos en el grupo verán el cambio al instante.</p>
      <input type="text" id="titleInput" maxlength="40" placeholder="Nombre del lugar (opcional) · ej: entrada del parque" />
      <input type="datetime-local" id="whenInput" />
      <div class="acts">
        <button class="no" id="modalNo">Cancelar</button>
        <button class="ok" id="modalOk">Guardar</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, deleteDoc, addDoc, collection, onSnapshot,
             query, orderBy, limit, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiqAsxD7_Me22aGHT9SO_AnRkJFyC5Xaw",
      authDomain: "proxi-live.firebaseapp.com",
      projectId: "proxi-live",
      storageBucket: "proxi-live.firebasestorage.app",
      messagingSenderId: "188965732831",
      appId: "1:188965732831:web:dd1eced1c6ce771c1ac46a"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---- identidad + sala (mismas claves que index.html: interoperan) ----
    const rnd = n => Array.from({length:n}, () => "abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*30)]).join("");
    let uid = localStorage.getItem("proxi_uid");
    if(!uid){ uid = rnd(9); localStorage.setItem("proxi_uid", uid); }
    const url = new URL(location.href);
    let room = url.searchParams.get("s");
    if(!room){ room = rnd(5); url.searchParams.set("s", room); history.replaceState(null,"",url); }
    document.getElementById("roomLabel").textContent = "junta · " + room;

    let name = localStorage.getItem("proxi_name") || ("Invitado-" + rnd(3));
    const nameInput = document.getElementById("nameInput");
    nameInput.value = name;
    nameInput.addEventListener("input", () => { name = nameInput.value.trim() || ("Invitado-"+uid.slice(0,3)); localStorage.setItem("proxi_name", name); pushNow(); });

    // ---- mapa ----
    const map = L.map("map", { zoomControl:true, attributionControl:true, tap:true }).setView([-33.4489,-70.6693], 3);
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom:22, maxNativeZoom:19, attribution:"Imagery © Esri" });
    const streets = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom:22, maxNativeZoom:20, attribution:"© OpenStreetMap, © CARTO" });
    sat.addTo(map);
    L.control.layers({ "Satélite":sat, "Oscuro":streets }, null, { position:"topright" }).addTo(map);
    map.doubleClickZoom.disable();

    const status = document.getElementById("status");
    const statusTxt = document.getElementById("statusTxt");
    function setStatus(t, ok=true){ statusTxt.textContent = t; status.classList.toggle("warn", !ok); status.classList.remove("hide"); }

    // ---- mi ubicación en vivo (misma colección miembros que index.html) ----
    let gps = null, firstFix = true;
    if("geolocation" in navigator){
      navigator.geolocation.watchPosition(
        p => { gps = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy };
               if(firstFix){ firstFix=false; if(!junta) map.setView([gps.lat,gps.lng], 17); }
               setStatus(dbReady ? "Conectado a la junta" : "Ubicación lista · conectando…", dbReady);
               pushNow(); renderJuntaUI(); },
        e => setStatus("Activa el permiso de ubicación para que te vean llegar", false),
        { enableHighAccuracy:true, maximumAge:1000, timeout:20000 });
    } else setStatus("Este equipo no soporta geolocalización", false);

    let dbReady = false, lastPush = 0, pending=false;
    const meDoc = doc(db, "salas", room, "miembros", uid);
    async function pushNow(){
      if(!gps) return;
      const now = Date.now(); if(now - lastPush < 1200){ pending=true; return; }
      lastPush = now; pending=false;
      try{
        await setDoc(meDoc, { name, lat:gps.lat, lng:gps.lng, acc:gps.acc, precise:false, ts:serverTimestamp(), t:now });
        if(!dbReady){ dbReady=true; setStatus("Conectado a la junta", true); setTimeout(()=>status.classList.add("hide"), 2500); }
      }catch(err){ setStatus("Sala aún no activa (revisa la base de datos)", false); }
    }
    setInterval(()=>{ if(pending) pushNow(); }, 1300);
    window.addEventListener("beforeunload", () => { try{ deleteDoc(meDoc); }catch(e){} });

    // ---- miembros del grupo en el mapa ----
    const markers = new Map();
    let memberCount = 0;
    function mkIcon(kind, label){ return L.divIcon({ className:"", html:`<div class="pin ${kind}"><span class="plabel">${esc(label)}</span></div>`, iconSize:[20,20], iconAnchor:[10,10] }); }
    function esc(s){ return String(s||"").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }

    onSnapshot(collection(db,"salas",room,"miembros"), snap => {
      const now = Date.now(); const seen = new Set(); let count = 0;
      snap.forEach(d => {
        const m = d.data(); if(!m || m.lat==null) return;
        if(m.t && now - m.t > 90000) return;
        seen.add(d.id); count++;
        const isMe = d.id === uid;
        const ll = [m.lat, m.lng];
        let mk = markers.get(d.id);
        if(!mk){ mk = L.marker(ll, { icon:mkIcon(isMe?"you":"friend", isMe?"tú":(m.name||"amigo")) }).addTo(map); markers.set(d.id, mk); }
        else { mk.setLatLng(ll); mk.setIcon(mkIcon(isMe?"you":"friend", isMe?"tú":(m.name||"amigo"))); }
      });
      for(const [id,mk] of markers){ if(!seen.has(id)){ map.removeLayer(mk); markers.delete(id); } }
      memberCount = count;
      renderJuntaUI();
    }, err => setStatus("Sala aún no activa (revisa la base de datos)", false));

    // ---- LA JUNTA: punto + hora compartidos ----
    const juntaDoc = doc(db, "salas", room, "junta", "actual");
    const cambiosCol = collection(db, "salas", room, "junta", "actual", "cambios");
    let junta = null;          // {lat,lng,when,title,by,byUid,t}
    let flagMk = null;
    let firstJuntaLoad = true;

    onSnapshot(juntaDoc, snap => {
      const prev = junta;
      junta = snap.exists() ? snap.data() : null;
      if(junta && junta.lat != null){
        const ll = [junta.lat, junta.lng];
        const label = junta.title ? esc(junta.title) : "punto de junta";
        const icon = L.divIcon({ className:"", html:`<div class="flagpin"><span class="plabel">${label}</span>🚩</div>`, iconSize:[30,30], iconAnchor:[4,28] });
        if(!flagMk){ flagMk = L.marker(ll, { icon, zIndexOffset:500 }).addTo(map); }
        else { flagMk.setLatLng(ll); flagMk.setIcon(icon); }
        if(firstJuntaLoad){ map.setView(ll, 17); }
        // aviso si lo cambió otra persona
        if(!firstJuntaLoad && junta.byUid !== uid && (!prev || prev.t !== junta.t)){
          const moved = prev && (prev.lat !== junta.lat || prev.lng !== junta.lng);
          const retimed = prev && prev.when !== junta.when;
          let what = !prev ? "fijó el punto de junta" :
                     moved && retimed ? "cambió el lugar y la hora" :
                     moved ? "movió el punto de junta" : "cambió la hora";
          showToast(`<b>${esc(junta.by||"Alguien")}</b> ${what}`,
                    (junta.when ? "🕒 " + fmtWhen(junta.when) + " · " : "") + "el mapa ya está actualizado");
          map.flyTo(ll, Math.max(map.getZoom(), 16));
        }
      } else if(flagMk){ map.removeLayer(flagMk); flagMk = null; }
      firstJuntaLoad = false;
      renderJuntaUI();
    });

    onSnapshot(query(cambiosCol, orderBy("t","desc"), limit(8)), snap => {
      const ul = document.getElementById("histList"); ul.innerHTML = "";
      snap.forEach(d => {
        const c = d.data(); const li = document.createElement("li");
        li.innerHTML = `<b>${esc(c.by||"Alguien")}</b> ${esc(c.what||"")} <small>· ${ago(c.t)}</small>`;
        ul.appendChild(li);
      });
    });

    async function saveJunta(patch, what){
      const base = junta || {};
      const data = {
        lat: patch.lat ?? base.lat ?? null,
        lng: patch.lng ?? base.lng ?? null,
        when: patch.when !== undefined ? patch.when : (base.when ?? null),
        title: patch.title !== undefined ? patch.title : (base.title ?? ""),
        by: name, byUid: uid, t: Date.now(), ts: serverTimestamp()
      };
      try{
        await setDoc(juntaDoc, data);
        await addDoc(cambiosCol, { by:name, what, t:Date.now(), ts:serverTimestamp() });
      }catch(err){ setStatus("No se pudo guardar (revisa conexión)", false); }
    }

    // ---- colocar / mover el punto ----
    const cross = document.getElementById("cross"), placebar = document.getElementById("placebar"), sheet = document.getElementById("sheet");
    let placing = false;
    function setPlacing(v){
      placing = v;
      cross.classList.toggle("on", v);
      placebar.classList.toggle("on", v);
      sheet.classList.toggle("away", v);
      if(v){
        setStatus("Mueve el mapa hasta el punto exacto de la junta", true);
        if(junta && junta.lat != null) map.setView([junta.lat, junta.lng], Math.max(map.getZoom(), 17));
        else if(gps) map.setView([gps.lat, gps.lng], Math.max(map.getZoom(), 17));
      } else status.classList.add("hide");
    }
    document.getElementById("setPointBtn").addEventListener("click", () => setPlacing(true));
    document.getElementById("placeCancel").addEventListener("click", () => setPlacing(false));
    document.getElementById("placeOk").addEventListener("click", async () => {
      const c = map.getCenter();
      const isNew = !junta || junta.lat == null;
      await saveJunta({ lat:c.lat, lng:c.lng }, isNew ? "fijó el punto de junta 🚩" : "movió el punto de junta 📍");
      setPlacing(false);
      if(isNew && !(junta && junta.when)) openModal(); // recién creada: pedir hora al tiro
    });
    map.on("dblclick", async (e) => {
      const isNew = !junta || junta.lat == null;
      await saveJunta({ lat:e.latlng.lat, lng:e.latlng.lng }, isNew ? "fijó el punto de junta 🚩" : "movió el punto de junta 📍");
    });

    // ---- hora ----
    const modal = document.getElementById("modal"), whenInput = document.getElementById("whenInput"), titleInput = document.getElementById("titleInput");
    function openModal(){
      const base = junta && junta.when ? new Date(junta.when) : (() => { const d = new Date(); d.setMinutes(d.getMinutes()+60,0,0); return d; })();
      const pad = n => String(n).padStart(2,"0");
      whenInput.value = `${base.getFullYear()}-${pad(base.getMonth()+1)}-${pad(base.getDate())}T${pad(base.getHours())}:${pad(base.getMinutes())}`;
      titleInput.value = junta && junta.title ? junta.title : "";
      modal.classList.add("on");
    }
    document.getElementById("setTimeBtn").addEventListener("click", openModal);
    document.getElementById("modalNo").addEventListener("click", () => modal.classList.remove("on"));
    document.getElementById("modalOk").addEventListener("click", async () => {
      const v = whenInput.value ? new Date(whenInput.value).getTime() : null;
      const title = titleInput.value.trim();
      const hadWhen = junta && junta.when;
      await saveJunta({ when:v, title }, hadWhen && v !== junta.when ? ("cambió la hora a las " + fmtWhen(v) + " 🕒") : ("puso hora: " + fmtWhen(v) + " 🕒"));
      modal.classList.remove("on");
    });

    // ---- UI de la junta ----
    const lead=document.getElementById("lead"), sub=document.getElementById("sub"),
          metric=document.getElementById("metric"), distEl=document.getElementById("dist"), distUnit=document.getElementById("distUnit"),
          timechips=document.getElementById("timechips"), chipWhen=document.getElementById("chipWhen"),
          chipCount=document.getElementById("chipCount"), chipPeople=document.getElementById("chipPeople"),
          setPointBtn=document.getElementById("setPointBtn");

    function renderJuntaUI(){
      if(junta && junta.lat != null){
        lead.textContent = junta.title || "Punto de junta fijado";
        sub.textContent = (junta.by ? "Último cambio: " + junta.by : "") + (junta.t ? " · " + ago(junta.t) : "");
        setPointBtn.innerHTML = "📍 Mover la junta";
        timechips.style.display = "flex";
        if(junta.when){
          chipWhen.textContent = "🕒 " + fmtWhen(junta.when);
          const diff = junta.when - Date.now();
          if(diff > 0){ chipCount.textContent = "falta " + durTxt(diff); chipCount.className = "chip " + (diff < 30*60000 ? "soon" : ""); }
          else { chipCount.textContent = "empezó hace " + durTxt(-diff); chipCount.className = "chip late"; }
          chipCount.style.display = "";
        } else { chipWhen.textContent = "🕒 sin hora aún"; chipCount.style.display = "none"; }
        chipPeople.textContent = "👥 " + (memberCount <= 1 ? "solo tú" : memberCount + " en el grupo");
        if(gps){
          const d = haversine(gps.lat, gps.lng, junta.lat, junta.lng);
          metric.style.display = "block";
          if(d >= 1000){ distEl.textContent = (d/1000).toFixed(1); distUnit.textContent = "km al punto"; }
          else { distEl.textContent = d < 10 ? d.toFixed(1) : Math.round(d); distUnit.textContent = "m al punto"; }
        } else metric.style.display = "none";
      } else {
        lead.textContent = "Aún no hay punto de junta";
        sub.textContent = "Fija dónde se juntan y compártelo al grupo";
        setPointBtn.innerHTML = "🚩 Fijar la junta aquí";
        timechips.style.display = "none";
        metric.style.display = "none";
      }
    }
    setInterval(renderJuntaUI, 30000); // refresca el "falta X min"

    document.getElementById("histBtn").addEventListener("click", () => document.getElementById("hist").classList.toggle("on"));

    // ---- toast ----
    const toast = document.getElementById("toast"), toastTx = document.getElementById("toastTx");
    let toastTimer = null;
    function showToast(html, small){
      toastTx.innerHTML = html + (small ? `<small>${small}</small>` : "");
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 6000);
      if(navigator.vibrate) navigator.vibrate(80);
    }

    // ---- helpers ----
    function haversine(a,b,c,d){ const R=6371000,rad=x=>x*Math.PI/180;
      const dLat=rad(c-a),dLng=rad(d-b); const s=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2;
      return 2*R*Math.asin(Math.sqrt(s)); }
    function fmtWhen(t){
      if(!t) return "—";
      const d = new Date(t), now = new Date();
      const hm = d.toLocaleTimeString("es-CL", {hour:"2-digit", minute:"2-digit"});
      const sameDay = d.toDateString() === now.toDateString();
      const tom = new Date(now); tom.setDate(tom.getDate()+1);
      if(sameDay) return "hoy " + hm;
      if(d.toDateString() === tom.toDateString()) return "mañana " + hm;
      return d.toLocaleDateString("es-CL", {weekday:"short", day:"numeric", month:"short"}) + " " + hm;
    }
    function durTxt(ms){
      const m = Math.round(ms/60000);
      if(m < 60) return m + " min";
      const h = Math.floor(m/60);
      return h + " h" + (m%60 ? " " + (m%60) + " min" : "");
    }
    function ago(t){ if(!t) return ""; const s = Math.round((Date.now()-t)/1000);
      if(s<60) return "recién"; if(s<3600) return "hace " + Math.round(s/60) + " min";
      if(s<86400) return "hace " + Math.round(s/3600) + " h"; return "hace " + Math.round(s/86400) + " días"; }

    // ---- compartir ----
    document.getElementById("shareBtn").addEventListener("click", async () => {
      const link = location.origin + "/junta.html?s=" + room;
      const when = junta && junta.when ? " " + fmtWhen(junta.when) : "";
      const msg = "Junta del grupo" + when + " 🚩 mira el punto exacto en el mapa (si cambia, lo ves al tiro): " + link;
      if(navigator.share){ try{ await navigator.share({ title:"Junta · Proxi", text:msg, url:link }); return; }catch(e){} }
      try{ await navigator.clipboard.writeText(link); setStatus("Link copiado ✓ pégalo en el grupo de WhatsApp", true); }
      catch(e){ window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank"); }
    });
  </script>
</body>
